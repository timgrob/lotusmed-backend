[project]
name = "lotusmed-backend"
version = "0.1.0"
description = "Backend for the Lotusmed application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20.0",
    "anthropic>=0.116.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.136.1",
    "google-genai>=2.11.0",
    "httpx2>=2.5.0",
    "openai>=2.33.0",
    "sqlalchemy[asyncio]>=2.0.51",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "pre-commit>=4.3.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
